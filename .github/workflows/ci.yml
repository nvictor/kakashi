name: Build and Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Test core and validator
        run: |
          swift test --package-path WorkflowCore -c release
          swift run --package-path WorkflowCore -c release workflow-validator validate examples --format json
          bash scripts/test-validator.sh
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project Kakashi/Kakashi.xcodeproj -scheme Kakashi \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
